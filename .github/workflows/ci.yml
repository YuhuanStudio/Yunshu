name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (core + dev only — fast, no modality extras)
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check python/ tests/

      - name: Ruff format check
        run: uv run ruff format --check python/ tests/

  test-unit:
    name: Unit Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (core + dev only — e2e needs models)
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q --tb=short

  build:
    name: Build Wheel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build sdist + wheel
        run: uv build

      - name: Verify console script is present
        run: |
          unzip -p dist/yunshu-*.whl "*/entry_points.txt" | grep -q "yunshu = yunshu_cli:app"
          echo "console_scripts entrypoint OK"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunshu-wheel
          path: dist/yunshu-*.whl
          retention-days: 7
