name: Docs site

# Prepared, not enabled for publishing: this workflow only runs when started by hand from the
# Actions tab. Deploying to GitHub Pages is outward-facing and needs the maintainer's OK; to
# publish, set Settings > Pages > Source to "GitHub Actions" and add a `push` trigger on `main`
# restricted to `site/**` and `python/yunshu_gateway/**`.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the built site to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build:
    # The OpenAPI dump imports the gateway, which needs the MLX core dependency (macOS only).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: uv sync --dev
      - run: uv run python site/scripts/dump_openapi.py
      - run: uv run python site/scripts/gen_content.py
      - run: cd site && pnpm install --frozen-lockfile
      - run: cd site && pnpm run typecheck
      - env:
          DOCS_BASE_PATH: /Yunshu
        run: cd site && pnpm exec next build
      - run: cd site && pnpm test && pnpm run check:links
      - if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
