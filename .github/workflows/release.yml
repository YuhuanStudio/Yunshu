name: Release

# Runs only when a maintainer pushes a version tag (vX.Y.Z) by hand; see
# RELEASING.md. Publishing uses the `pypi` environment (trusted publishing, no approval step).
on:
  push:
    # vX.Y.Z: a patch release (full gate); vX.Y.Z.devN: a dev release, every other push
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"]
  # Re-run the release of an existing tag (e.g. the tag-push run was cancelled by a runner
  # brownout): the workflow comes from main, the code from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (vX.Y.Z)"
        required: true
      deselect:
        description: >-
          Space-separated unit test ids to skip on the hosted VM: tests that need M5-class GPU
          kernels and were verified by ci-local and the release gate on the M5 (re-runs only)
        required: false
        default: ""

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Tag matches pyproject version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v${version}" = "${TAG}" || {
            echo "tag ${TAG} != pyproject version ${version}"; exit 1; }

      - name: Changelog has an entry for this version
        run: |
          case "$TAG" in
            *.dev*) grep -q "^## \[Unreleased\]" CHANGELOG.md ;;
            *) grep -q "^## \[${TAG#v}\]" CHANGELOG.md ;;
          esac

      - name: Lint and unit tests
        run: |
          uv python install 3.13
          uv sync --dev --extra vision --extra compression
          uv run ruff check python/ tests/
          uv run ruff format --check python/ tests/
          uv run python scripts/dev/mypy_gate.py
          DESELECT=""
          for t in ${{ inputs.deselect }}; do DESELECT="$DESELECT --deselect $t"; done
          uv run pytest tests/unit -q --tb=short -n auto --dist loadfile -m "not serial" $DESELECT && uv run pytest tests/unit -q --tb=short -m serial $DESELECT

      - name: Set up Node for the console
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate the console
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build
          pnpm exec yunui doctor --strict
          pnpm exec yunui audit --strict

      - name: Build sdist + wheel
        run: uv build

      - name: Verify packaged console assets
        run: |
          python3 - <<'PYCODE'
          import glob, tarfile, zipfile
          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              assert "yunshu_gateway/console_static/index.html" in wheel.namelist()
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as source:
              assert any(name.endswith("python/yunshu_gateway/console_static/index.html") for name in source.getnames())
          PYCODE

      - name: Check package metadata (twine)
        run: uvx twine check dist/*

      - name: Install the wheel into a clean tool env and run doctor
        run: |
          uv tool install --python 3.13 "$(ls dist/yunshu-*.whl)"
          yunshu --version
          yunshu doctor --port 18999 || true  # Metal may be missing on a VM runner

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release (draft)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release/notes.py "${TAG#v}" --output notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            *.dev*) gh release create "$TAG" dist/* --prerelease --title "$TAG" --notes-file notes.md ;;
            *) gh release create "$TAG" dist/* --draft --title "$TAG" --notes-file notes.md ;;
          esac
