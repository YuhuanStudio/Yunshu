name: Release

# Runs only when a maintainer pushes a version tag (vX.Y.Z) by hand; see
# RELEASING.md. Publishing waits for approval on the `pypi` environment.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Tag matches pyproject version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != pyproject version ${version}"; exit 1; }

      - name: Changelog has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

      - name: Lint and unit tests
        run: |
          uv python install 3.13
          uv sync --dev --extra vision --extra compression
          uv run ruff check python/ tests/
          uv run pytest tests/unit -q --tb=short

      - name: Set up Node for the console
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate the console
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm exec yunui doctor --strict
          pnpm exec yunui audit --strict

      - name: Build sdist + wheel
        run: uv build

      - name: Verify packaged console assets
        run: |
          python3 - <<'PYCODE'
          import glob, tarfile, zipfile
          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              assert "yunshu_gateway/console_static/index.html" in wheel.namelist()
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as source:
              assert any(name.endswith("python/yunshu_gateway/console_static/index.html") for name in source.getnames())
          PYCODE

      - name: Check package metadata (twine)
        run: uvx twine check dist/*

      - name: Install the wheel into a clean tool env and run doctor
        run: |
          uv tool install --python 3.13 "$(ls dist/yunshu-*.whl)"
          yunshu --version
          yunshu doctor --port 18999 || true  # Metal may be missing on a VM runner

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release (draft)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release/notes.py "${GITHUB_REF_NAME#v}" --output notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
