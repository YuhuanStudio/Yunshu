allowBuilds:
  esbuild: true

# YunUI's controls and Fumadocs share these compatible Radix patches. Avoid
# shipping two copies of collection/focus state machinery in the console shell.
overrides:
  "@radix-ui/react-collection@1.1.15": "1.1.16"
  "@radix-ui/react-roving-focus@1.1.19": "1.1.20"
  "@radix-ui/react-collapsible@1.1.20": "1.1.21"
  "@radix-ui/react-direction@1.1.4": "1.1.5"
  "@radix-ui/react-presence@1.1.10": "1.1.11"
  "@radix-ui/react-primitive@2.1.10": "2.1.11"
  "@radix-ui/react-use-callback-ref@1.1.4": "1.1.5"
  "@radix-ui/react-use-size@1.1.4": "1.1.5"
  "@radix-ui/react-visually-hidden@1.2.11": "1.2.13"
  "@radix-ui/react-slot@1.3.3": "1.4.0"
