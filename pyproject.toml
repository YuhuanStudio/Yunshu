[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/yunshu_gateway", "python/yunshu_control", "python/yunshu_engine", "python/yunshu_kv", "python/yunshu_cli", "python/yunshu_client"]
# The frontend build writes this ignored/generated directory immediately before
# packaging. Include it in the wheel when present without requiring inference.
artifacts = ["python/yunshu_gateway/console_static/**"]

# The sdist carries what is needed to build and test the package, not the
# local benchmark data.
[tool.hatch.build.targets.sdist]
artifacts = ["python/yunshu_gateway/console_static/**"]
include = [
    "python/",
    "frontend/",
    "docs/CONSOLE.md",
    "tests/",
    "examples/",
    "README*.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
    "uv.lock",
]
exclude = [
    "frontend/node_modules/",
    "frontend/node_modules/**",
    "frontend/dist/",
    "frontend/dist/**",
    "frontend/test-results/",
    "frontend/test-results/**",
    "frontend/playwright-report/",
    "frontend/playwright-report/**",
    "frontend/evidence/",
    "frontend/evidence/**",
    "frontend/*.tsbuildinfo",
    "site/",
    "site/**",
]

[project]
name = "yunshu"
version = "0.1.4"
description = "Fast local single-node LLM/VLM inference engine for Apple Silicon — speculative decoding, prefix reuse, OpenAI/Anthropic-compatible"
readme = "README.md"
license = "Apache-2.0"
# Vendored oMLX (Apache-2.0) and TensorFold (MIT) kernels: their notices ship too.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
authors = [
    {name = "YuhuanStudio"},
]
keywords = ["mlx", "apple-silicon", "inference", "llm", "vlm", "speculative-decoding", "prefix-cache", "anthropic-compatible", "openai-compatible", "local-ai", "mac"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: GPU",
    "Framework :: FastAPI",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps = the minimum for text serving to work out of the box:
# `pip install yunshu && yunshu serve -m <model>` must boot a working
# /v1/chat/completions endpoint. The heavy modality backends (mlx-vlm,
# mlx-audio, mlx-embeddings, diffusers) are OPTIONAL EXTRAS so a base
# install stays light on machines that only need text.
dependencies = [
    # ── Apple ML Stack (text path only) ──
    # Capped until our row-exact qmv copies (kernels/omlx/row_exact_qmv.py, moe_verify_gather.py,
    # kernels/verify_select.py) are re-transcribed: mlx f8aaf49d (after 0.32.3) changes qmv's
    # load_vector accumulation, so spec-on would drift from spec-off.
    "mlx>=0.32.3,<0.32.4",
    "mlx-lm>=0.32.0",
    # ── Model / Tokenizer ──
    "transformers>=5.19.0",
    "tokenizers>=0.23.2",
    "safetensors>=0.5.0",
    "huggingface-hub>=1.33.0",
    # ── API Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "httpx>=0.28.0",
    "pypdf>=6.0.0",
    "pypdfium2>=5.0.0",
    "regex>=2024.11.6",  # bounded-time crawler selectors
    "pycountry>=24.6.1",  # provider country mapping
    "langdetect>=1.0.9",  # CPU-only strict language filter
    "trafilatura==2.1.0",  # Apache-2.0, verified upstream/PyPI (>=1.8 required).
    "websockets>=15.0.0",
    "sse-starlette>=2.2.0",
    # ── Auth ──
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    # ── Observability ──
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "prometheus-client>=0.22.0",
    "structlog>=24.5.0",
    # ── Numerical ──
    "numpy>=1.24.0",
    "scipy>=1.15.0",
    # ── CLI ──
    "typer>=0.15.0",
    "rich>=13.0.0",
    # ── System ──
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
    "python-multipart>=0.0.27",
    "openai>=2.33.0",
    "jsonschema>=4.26.0",
    "llguidance>=1.9.1",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/YuhuanStudio/Yunshu"
Documentation = "https://github.com/YuhuanStudio/Yunshu/tree/main/docs"
Source = "https://github.com/YuhuanStudio/Yunshu"
Issues = "https://github.com/YuhuanStudio/Yunshu/issues"
Changelog = "https://github.com/YuhuanStudio/Yunshu/blob/main/CHANGELOG.md"

[project.optional-dependencies]
webrtc = ["aiortc>=1.15,<2"]
web-render = ["playwright>=1.48,<2"]
# Vision / VLM / OCR (mlx-vlm) — needed for image inputs and vision-language models.
vision = [
    # >=0.7.3: APC (semantic_extra_hash / resident_bytes) and speculative MTP,
    # both used by the Qwen3.5/3.8 VLM path.
    "mlx-vlm>=0.7.6",
    "Pillow>=10.0.0",
]
# Audio: speech-to-text (ASR) + text-to-speech (TTS) via mlx-audio.
# Also the backbone for the Realtime voice WebSocket.
audio = [
    "mlx-audio>=0.5.8",
]
# Native omni (Qwen3-Omni Thinker+Talker: speech-in/speech-out from ONE model)
# — the forward-differentiation surface (/v1/omni/speech/stream + the native
# Realtime path). Needs mlx-vlm AND torch/torchvision: transformers eagerly loads
# Qwen3-Omni's video sub-processor on model load, which hard-requires torch even
# though Yunshu never runs video inference. mlx-vlm>=0.6.0 carries the audio-input
# fix (#1240) the native speech-in path relies on. Upstream 0.7.3 was verified
# to keep turn 2+ correct for text and speech input (2026-09-28), so the fork's
# position_ids patch is gone.
omni = [
    "mlx-vlm>=0.7.6",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
]
# Embeddings endpoint (/v1/embeddings) via mlx-embeddings.
embeddings = [
    "mlx-embeddings>=0.1.0",
]
# Image generation pipelines. Absent → /v1/images/generations returns an honest 503
# instead of placeholder bytes.
generation = [
    "diffusers>=0.37.1",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
]
# Optional local compression codecs, including lossless APC WARM / lower storage
# tier encoding. No distributed serving or cross-node KV offload is offered.
compression = [
    "zstandard>=0.22.0",
    "lz4>=4.3.0",
]
# Every optional modality.
all = [
    "yunshu[vision]",
    "yunshu[audio]",
    "yunshu[omni]",
    "yunshu[embeddings]",
    "yunshu[generation]",
    "yunshu[compression]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
]
bench = [
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
yunshu = "yunshu_cli:main"

[dependency-groups]
dev = [
    "anthropic>=1.9.0",
    "matplotlib>=3.10.9",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.30.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["python", "tests"]
extend-exclude = [
    "reference",
    "scripts/research/agentic/tasks",
    "python/yunshu_engine/kernels/omlx/qwen35_*.py",
    "python/yunshu_engine/kernels/omlx/row_exact_qmv.py",
    "python/yunshu_engine/kernels/omlx/module_cache.py",
    "python/yunshu_engine/kernels/omlx/moe_verify_gather.py",
    "python/yunshu_engine/kernels/tensorfold/lane_qmm.py",
    "python/yunshu_engine/kernels/tensorfold/lane_widen.py",
    "python/yunshu_engine/kernels/tensorfold/inputs.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# E501 line-too-long: code prioritizes readability over strict 88-col
# E402 module-level import not at top: PEP-563 `from __future__` then docstring;
#      Typer/FastAPI subcommand registration after `typer.Typer()` is constructed
# E702 multiple statements on one line: vectorized numpy one-liners in
#      yunshu_engine/batched_engine.py for code locality
# E741 ambiguous variable name: matrix-math conventions Q/K/V/H/M/N/D
# N803 invalid-argument-name: matrix-math kwargs (Q=..., K=..., V=...)
# N806 invalid-variable-name: matrix-math local conventions Q/K/V/H/M/N/D in
#      attention/GEMM/quant kernels — see python/yunshu_engine/batched_engine.py
# B008 function-call-in-default-arg: mandatory FastAPI DI pattern (Depends/Query/Path/Body/Header/Form/File/Security)
# B023 function-uses-loop-variable: call-site false positives in
#      python/yunshu_engine/batched_engine.py — see scheduler.py:1593 etc.
# --- documented intentional style categories ---
# N801/N802 invalid-class/function-name: camelCase mirrors JSON-schema keywords
#      (_flatten_allOf, _process_anyOf) + dunder methods defined inside monkey-patch
#      functions (mtp_patch.py) which ruff misreads.
# N807 dunder-function-name: __init__/__call__ assigned inside patch closures.
# N814/N817 camelcase-imported-as-constant/acronym: matrix-math + protocol acronyms.
# SIM102 collapsible-if: nested ifs kept separate for MLX tensor-condition readability.
# SIM117 multiple-with-statements: separate `with` blocks for resource-scoping clarity.
# B027 empty-method-without-abstract-decorator: intentional optional override hooks.
# B015 useless-comparison: assertions-as-documentation in a couple of spots.
# E701 multiple-statements-on-one-line-colon: compact guard clauses.
ignore = [
    "E501", "E402", "E702", "E741", "N803", "N806", "B008", "B023",
    "N801", "N802", "N807", "N814", "N817",
    "SIM102", "SIM117", "B027", "B015", "E701",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Optional-extra packages are typed as Any whether or not they are installed, so the
# baseline gate gives the same result locally (all extras) and in CI (base deps only).
[[tool.mypy.overrides]]
module = [
    "mlx_vlm.*",
    "mlx_audio.*",
    "mlx_embeddings.*",
    "diffusers.*",
    "torch.*",
    "torchvision.*",
    "PIL.*",
    "zstandard.*",
    "lz4.*",
    "xxhash.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
xfail_strict = true
addopts = [
    "-ra",
    "--tb=short",
    "--ignore=tests/integration",
]
markers = [
    "gpu: requires Apple GPU / MLX runtime",
    "integration: requires running services or real models",
    "slow: tests that take >5 seconds",
]
