[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/yunshu_gateway", "python/yunshu_control", "python/yunshu_engine", "python/yunshu_kv", "python/yunshu_cli"]

[project]
name = "yunshu"
version = "0.0.1"
description = "Fast local multimodal (omni) inference engine for Apple Silicon — OpenAI/Anthropic-compatible, with native streaming speech-to-speech"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    {name = "YuhuanStudio"},
]
keywords = ["mlx", "apple-silicon", "qwen-omni", "speech-to-speech", "voice-agent", "realtime", "local-ai", "llm", "multimodal", "mac"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps = the minimum for text serving to work out of the box:
# `pip install yunshu && yunshu serve -m <model>` must boot a working
# /v1/chat/completions endpoint. The heavy modality backends (mlx-vlm,
# mlx-audio, mlx-embeddings, diffusers) are OPTIONAL EXTRAS so a base
# install stays light on machines that only need text.
dependencies = [
    # ── Apple ML Stack (text path only) ──
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    # ── Model / Tokenizer ──
    "transformers>=4.53.0",
    "tokenizers>=0.21.0",
    "safetensors>=0.5.0",
    "huggingface-hub>=0.23.0",
    # ── API Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "httpx>=0.28.0",
    "websockets>=15.0.0",
    "sse-starlette>=2.2.0",
    # ── Auth ──
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    # ── Observability ──
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "prometheus-client>=0.22.0",
    "structlog>=24.5.0",
    # ── Numerical ──
    "numpy>=1.24.0",
    "scipy>=1.15.0",
    # ── CLI ──
    "typer>=0.15.0",
    "rich>=13.0.0",
    # ── System ──
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
    "python-multipart>=0.0.27",
    "openai>=2.33.0",
    "jsonschema>=4.26.0",
]

[project.urls]
Homepage = "https://github.com/YuhuanStudio/Yunshu"
Source = "https://github.com/YuhuanStudio/Yunshu"
Issues = "https://github.com/YuhuanStudio/Yunshu/issues"

[project.optional-dependencies]
# Vision / VLM / OCR (mlx-vlm) — needed for image inputs and vision-language models.
vision = [
    "mlx-vlm>=0.4.4",
    "Pillow>=10.0.0",
]
# Audio: speech-to-text (ASR) + text-to-speech (TTS) via mlx-audio.
# Also the backbone for the Realtime voice WebSocket.
audio = [
    "mlx-audio>=0.2.0",
]
# Native omni (Qwen3-Omni Thinker+Talker: speech-in/speech-out from ONE model)
# — the forward-differentiation surface (/v1/omni/speech/stream + the native
# Realtime path). Needs mlx-vlm AND torch/torchvision: transformers eagerly loads
# Qwen3-Omni's video sub-processor on model load, which hard-requires torch even
# though Yunshu never runs video inference. mlx-vlm>=0.6.0 carries the audio-input
# fix (#1240) the native speech-in path relies on.
omni = [
    "mlx-vlm>=0.6.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
]
# Embeddings endpoint (/v1/embeddings) via mlx-embeddings.
embeddings = [
    "mlx-embeddings>=0.1.0",
]
# Image / video generation pipelines. Absent → /v1/images/generations and
# /v1/video/generations return an honest 503 instead of placeholder bytes.
generation = [
    "diffusers>=0.37.1",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
]
# Native video generation (yunshu_engine.video_engine) — Wan 2.x / LTX-2 text-to-video
# and image-to-video via mlx-video. Pinned to git below: the PyPI 0.1.0 release is
# preprocessing-only (just _io/_transforms), while the full Wan/LTX generate pipeline
# lives on main. The integration is verified live on Wan2.2-TI2V-5B.
video = [
    "mlx-video",
    # mlx-video pulls librosa (LTX audio) → numba → llvmlite. Without these floors
    # uv backtracks to llvmlite 0.36 (supports Python <=3.9 only) and the build hard-
    # fails on 3.13. Pin to the py3.13-compatible line.
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
]
# KV-transfer wire compression (yunshu_engine.kv_transfer). Absent → transfers
# fall back to uncompressed (the codec is now honestly recorded in the header).
compression = [
    "zstandard>=0.22.0",
    "lz4>=4.3.0",
]
# Omni: every modality above. This is what `pip install "yunshu[all]"` installs
# for users who want the full text+vision+audio+image+embeddings surface.
all = [
    "yunshu[vision]",
    "yunshu[audio]",
    "yunshu[omni]",
    "yunshu[embeddings]",
    "yunshu[generation]",
    "yunshu[compression]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
]
bench = [
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
yunshu = "yunshu_cli:app"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.30.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
    # torch + einops: PyTorch-reference parity test for the Wan2.2 VAE MLX port
    # (tests/unit/test_wan_vae.py::test_numerical_parity_vs_torch_reference). torch
    # is also an [omni]/[all] runtime extra; pinning it in dev keeps `just test`
    # skip-free. CPU torch is sufficient — the test only runs reference modules.
    "torch>=2.1.0",
    "einops>=0.7.0",
]

# Source mlx-vlm from our fork's branch, which is latest upstream main plus the
# Qwen3-Omni thinker early-exit optimization (byte-identical, ~1.86x faster on the
# redundant hidden-state forward). Tracking the branch means `uv sync --upgrade`
# keeps pulling the latest. Revert to a plain release pin once the PR merges upstream.
[tool.uv.sources]
mlx-vlm = { git = "https://github.com/yuhuanowo/mlx-vlm.git", branch = "feat/qwen3-omni-thinker-early-exit" }
mlx-video = { git = "https://github.com/Blaizzy/mlx-video.git" }

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["python", "tests"]
extend-exclude = ["reference", "webui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# E501 line-too-long: code prioritizes readability over strict 88-col
# E402 module-level import not at top: PEP-563 `from __future__` then docstring;
#      Typer/FastAPI subcommand registration after `typer.Typer()` is constructed
# E702 multiple statements on one line: vectorized numpy one-liners in
#      yunshu_engine/batched_engine.py for code locality
# E741 ambiguous variable name: matrix-math conventions Q/K/V/H/M/N/D
# N803 invalid-argument-name: matrix-math kwargs (Q=..., K=..., V=...)
# N806 invalid-variable-name: matrix-math local conventions Q/K/V/H/M/N/D in
#      attention/GEMM/quant kernels — see python/yunshu_engine/batched_engine.py
# B008 function-call-in-default-arg: mandatory FastAPI DI pattern (Depends/Query/Path/Body/Header/Form/File/Security)
# B023 function-uses-loop-variable: call-site false positives in
#      python/yunshu_engine/batched_engine.py — see scheduler.py:1593 etc.
# --- documented intentional style categories ---
# N801/N802 invalid-class/function-name: camelCase mirrors JSON-schema keywords
#      (_flatten_allOf, _process_anyOf) + dunder methods defined inside monkey-patch
#      functions (mtp_patch.py) which ruff misreads.
# N807 dunder-function-name: __init__/__call__ assigned inside patch closures.
# N814/N817 camelcase-imported-as-constant/acronym: matrix-math + protocol acronyms.
# SIM102 collapsible-if: nested ifs kept separate for MLX tensor-condition readability.
# SIM117 multiple-with-statements: separate `with` blocks for resource-scoping clarity.
# B027 empty-method-without-abstract-decorator: intentional optional override hooks.
# B015 useless-comparison: assertions-as-documentation in a couple of spots.
# E701 multiple-statements-on-one-line-colon: compact guard clauses.
ignore = [
    "E501", "E402", "E702", "E741", "N803", "N806", "B008", "B023",
    "N801", "N802", "N807", "N814", "N817",
    "SIM102", "SIM117", "B027", "B015", "E701",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
xfail_strict = true
addopts = [
    "-ra",
    "--tb=short",
    "--ignore=tests/integration",
]
markers = [
    "gpu: requires Apple GPU / MLX runtime",
    "integration: requires running services or real models",
    "slow: tests that take >5 seconds",
]
