[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/yunshu_gateway", "python/yunshu_control", "python/yunshu_engine", "python/yunshu_kv", "python/yunshu_mesh", "python/yunshu_api", "python/yunshu_sdk", "python/yunshu_cli"]

[project]
name = "yunshu"
version = "0.0.1"
description = "Production-grade MLX inference platform for Apple Silicon clusters"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    {name = "YuhuanStudio"},
]
keywords = ["mlx", "apple-silicon", "llm", "inference", "distributed", "mac"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── Apple ML Stack ──
    "mlx>=0.31.2",
    "mlx-lm>=0.31.2",
    "mlx-vlm>=0.4.4",
    "mlx-embeddings>=0.1.0",
    "mlx-audio>=0.2.0",
    # ── Model / Tokenizer ──
    "transformers>=4.53.0",
    "tokenizers>=0.21.0",
    "safetensors>=0.5.0",
    "huggingface-hub>=0.23.0",
    # ── API Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "httpx>=0.28.0",
    "websockets>=15.0.0",
    "sse-starlette>=2.2.0",
    # ── Auth ──
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    # ── Observability ──
    "opentelemetry-api>=1.33.0",
    "opentelemetry-sdk>=1.33.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "prometheus-client>=0.22.0",
    "structlog>=24.5.0",
    # ── Numerical ──
    "numpy>=1.24.0",
    "scipy>=1.15.0",
    # ── CLI ──
    "typer>=0.15.0",
    "rich>=13.0.0",
    # ── System ──
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
    "diffusers>=0.37.1",
    "python-multipart>=0.0.27",
    "openai>=2.33.0",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
]
bench = [
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
]
vision = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
]

[project.scripts]
yunshu = "yunshu_cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["python", "tests"]
extend-exclude = ["reference", "webui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
xfail_strict = true
addopts = [
    "-ra",
    "--tb=short",
    "--ignore=tests/integration",
]
markers = [
    "gpu: requires Apple GPU / MLX runtime",
    "integration: requires running services or real models",
    "slow: tests that take >5 seconds",
]
